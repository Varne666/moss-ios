name: Moss
options:
  bundleIdPrefix: org.mossios
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '26.6'
  createIntermediateGroups: true
packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    CODE_SIGNING_ALLOWED: 'NO'
    MARKETING_VERSION: 1.0.1
    CURRENT_PROJECT_VERSION: '2'
targets:
  Moss:
    type: application
    platform: iOS
    sources:
      - path: Moss
        excludes:
          - Info.plist
          - Moss.entitlements
    info:
      path: Moss/Info.plist
      properties:
        CFBundleDisplayName: Moss
        CFBundleShortVersionString: 1.0.1
        CFBundleVersion: '2'
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: Moss saves an image to Photos only when you ask it to, or when automatic saving is enabled.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).generate.*
          - $(PRODUCT_BUNDLE_IDENTIFIER).download.*
    entitlements:
      path: Moss/Moss.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mossios.app
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: 'YES'
        SUPPORTS_MACCATALYST: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
    dependencies:
      - package: mlx-swift
        product: MLX
      - target: MossActivity
  MossActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: MossActivity
      - path: Moss/Shared
    info:
      path: MossActivity/Info.plist
      properties:
        CFBundleDisplayName: Moss
        CFBundleShortVersionString: 1.0.1
        CFBundleVersion: '2'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mossios.app.activity
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_EMIT_LOC_STRINGS: 'YES'
  MossCLI:
    type: tool
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - path: CLI
      - path: Moss/Engine
      - path: Moss/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mossios.cli
        MACOSX_DEPLOYMENT_TARGET: '26.0'
    dependencies:
      - package: mlx-swift
        product: MLX
  MossTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: MossActivity/ActivityViews.swift
      - path: Moss/Shared/GenerationActivity.swift
    dependencies:
      - target: Moss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mossios.tests
        GENERATE_INFOPLIST_FILE: 'YES'
schemes:
  MossCLI:
    build:
      targets:
        MossCLI: all
    run:
      config: Release
    archive:
      config: Release
  Moss:
    build:
      targets:
        Moss: all
        MossTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MossTests
    archive:
      config: Release
