name: Inspect remote checkpoints
on:
  push:
    branches: [inspect]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Civitai
        continue-on-error: true
        run: |
          mkdir -p out
          for host in civitai.com civitai.red; do
            echo "== $host version" >> out/civitai.txt
            curl -sSL -m 30 "https://$host/api/v1/model-versions/3417962" >> out/civitai.txt 2>&1; echo >> out/civitai.txt
            echo "== $host model" >> out/civitai.txt
            curl -sSL -m 30 "https://$host/api/v1/models/2268008" | head -c 20000 >> out/civitai.txt 2>&1; echo >> out/civitai.txt
            echo "== $host download head" >> out/civitai.txt
            curl -sSI -m 30 "https://$host/api/download/models/3417962" >> out/civitai.txt 2>&1
          done
      - name: Headers
        continue-on-error: true
        run: |
          mkdir -p out
          python3 scripts/remote_headers.py $(cat ci/urls.txt) 2>&1 | tee out/headers.txt
          for repo in lodestones/Kromoss OpenMOSS-Team/MOSS-Image-Base; do
            echo "$repo $(curl -fsSL https://huggingface.co/api/models/$repo | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])')" | tee -a out/pins.txt
          done
          K=$(grep lodestones/Kromoss out/pins.txt | cut -d' ' -f2)
          for f in diffusion_models/kromoss_bf16.safetensors 8-steps-dmd2-lora.safetensors; do
            echo "== $f" | tee -a out/pins.txt
            curl -fsSI "https://huggingface.co/lodestones/Kromoss/resolve/$K/$f" | grep -iE "^(x-linked-etag|x-linked-size|x-repo-commit)" | tee -a out/pins.txt
          done
          curl -fsSL "https://huggingface.co/api/models/lodestones/Kromoss/tree/$K?recursive=true" | python3 -m json.tool | head -80 | tee -a out/pins.txt
      - name: Publish
        if: always()
        run: |
          OUT=$RUNNER_TEMP/pub; mkdir -p "$OUT"; cp out/* "$OUT/"; cd "$OUT"
          git init -q -b inspect-output; git config user.name moss-ci; git config user.email moss-ci@users.noreply.github.com
          git add -A; git commit -qm "inspect ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:inspect-output
