name: Real inference check (Mac)
# Triggered by pushing to the run-inference branch; parameters come from ci/inference.json on that branch.
on:
  push:
    branches: [run-inference]
permissions:
  contents: write
concurrency:
  group: moss-inference
  cancel-in-progress: true
jobs:
  infer:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Read request
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          r = json.load(open('ci/inference.json'))
          for k, v in {'prompt': 'A red fox sitting in fresh snow, golden hour, photograph', 'width': '256', 'height': '256', 'preset': 'best', 'steps': '', 'seed': '42', 'label': 'check', 'extra': '', 'cache_mb': '', 'kromoss': ''}.items():
              print(f"REQ_{k.upper()}={str(r.get(k, v)).replace(chr(10), ' ')}")
          PY
      - name: Machine
        run: |
          mkdir -p out
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$XCODE/Contents/Developer"
          { sw_vers; sysctl -n hw.memsize hw.model machdep.cpu.brand_string; df -h /; system_profiler SPDisplaysDataType; } 2>&1 | tee out/machine.log
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build harness from the app's engine sources
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project Moss.xcodeproj -scheme MossCLI -configuration Release -destination 'platform=macOS' \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/cli-build.log | grep -E "error:|BUILD" || true
          test -x build/DD/Build/Products/Release/MossCLI
          build/DD/Build/Products/Release/MossCLI --selftest 2>&1 | tee out/selftest.log
      - name: Download real weights
        run: |
          ADAPTER=""; [ "${{ env.REQ_PRESET }}" = "fast" ] && ADAPTER="--adapter"
          KROMOSS=""; [ -n "${{ env.REQ_KROMOSS }}" ] && KROMOSS="--kromoss"
          python3 scripts/download_models.py "$RUNNER_TEMP/models" $ADAPTER $KROMOSS 2>&1 | tee out/download.log
          if [ -n "$KROMOSS" ]; then
            /usr/bin/time -l build/DD/Build/Products/Release/MossCLI --convert-kromoss "$RUNNER_TEMP/models/kromoss/kromoss_bf16.safetensors" \
              --models "$RUNNER_TEMP/models" --manifest Moss/Resources/model-manifest.json 2>&1 | tee out/convert.log
            rm -f "$RUNNER_TEMP/models/kromoss/kromoss_bf16.safetensors"; ls -la "$RUNNER_TEMP/models/kromoss" | tee -a out/convert.log
          fi
          df -h / | tee -a out/download.log
          python3 scripts/inspect_checkpoint.py "$RUNNER_TEMP/models" > out/checkpoint.txt 2>&1 || true
      - name: Generate
        run: |
          set -o pipefail
          STEPS=""; [ -n "${{ env.REQ_STEPS }}" ] && STEPS="--steps ${{ env.REQ_STEPS }}"
          [ -n "${{ env.REQ_CACHE_MB }}" ] && export MOSS_LAYER_CACHE_MB="${{ env.REQ_CACHE_MB }}"
          /usr/bin/time -l build/DD/Build/Products/Release/MossCLI --models "$RUNNER_TEMP/models" \
            --manifest Moss/Resources/model-manifest.json --out out/image.png \
            --prompt "${{ env.REQ_PROMPT }}" --width ${{ env.REQ_WIDTH }} --height ${{ env.REQ_HEIGHT }} \
            --preset ${{ env.REQ_PRESET }} $STEPS --seed ${{ env.REQ_SEED }} ${{ env.REQ_EXTRA }} 2>&1 | tee out/generate.log
      - name: Publish
        if: always()
        run: |
          OUT=$RUNNER_TEMP/pub; rm -rf "$OUT"; git clone -q --depth 1 -b inference-output "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$OUT" 2>/dev/null || { mkdir -p "$OUT"; git -C "$OUT" init -q -b inference-output; }
          D="$OUT/${{ github.run_number }}-${{ env.REQ_LABEL }}"; mkdir -p "$D"; cp -R out/. "$D/"
          echo "status=${{ job.status }} sha=${{ github.sha }}" > "$D/RESULT.txt"
          cd "$OUT"; git config user.name moss-ci; git config user.email moss-ci@users.noreply.github.com
          git add -A; git commit -qm "inference ${{ github.run_number }} ${{ env.REQ_LABEL }} ${{ job.status }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:inference-output
